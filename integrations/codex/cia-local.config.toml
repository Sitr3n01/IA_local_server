# Explicit local profile. The base OpenAI provider and login remain untouched.
model = "local-coding"
model_provider = "cia-local"
model_catalog_json = 'C:\IA\local-ai-v2\config\codex-model-catalog.json'
# Context window and the auto-compaction threshold are deliberately NOT set
# here. They were previously pinned globally at 131072 / 110000, which governed
# whichever model the profile selected: a 32k profile inherited a 128k window and
# a 110k compaction threshold, and a 256k profile was capped at 128k. Both are
# wrong, and the second is silent.
#
# model_catalog_json above carries context_window, max_context_window and
# effective_context_window_percent per model, generated from config/models.yaml
# by scripts/v2/New-V2ClientCatalogs.ps1. That catalog is the single source of
# truth for the context contract; a global override here can only disagree with
# it.
#
# Codex's precedence between a global model_context_window and a catalog entry
# could not be demonstrated on this machine - the Codex CLI is not installed
# here, only the desktop application - so the keys are removed rather than
# reordered or relied upon. See benchmarks/REPORT-qwen38-27b-q3-q2-kvq4-20260821.md
# section 12.
model_reasoning_effort = "medium"
model_reasoning_summary = "none"
model_verbosity = "low"
web_search = "disabled"

[features]
enable_request_compression = false

[model_providers.cia-local]
name = "CIA Local AI"
base_url = "http://127.0.0.1:8090/v1"
wire_api = "responses"
request_max_retries = 1
stream_max_retries = 1
# Raised from 300000. Time-to-first-token is bounded by prefill, and a cold
# 96k-token prompt against a partially offloaded 27B runs far past five minutes
# on DDR5. The edge already allows 1800s (DefaultHeaderTimeout).
stream_idle_timeout_ms = 900000

[model_providers.cia-local.auth]
command = 'C:\IA\local-ai-v2\bin\cia-credential.exe'
args = ["get", "inference"]
timeout_ms = 5000
refresh_interval_ms = 0

[mcp_servers.cia-local]
command = 'C:\IA\local-ai-v2\bin\cia-mcp.exe'
enabled = true
required = true
startup_timeout_sec = 10
tool_timeout_sec = 30
enabled_tools = [
  "local_ai_health",
  "local_ai_models",
  "local_ai_active_model",
  "local_ai_capacity",
  "local_ai_recent_events",
]

[mcp_servers.cia-local.env]
CIA_CONTROL_URL = "http://127.0.0.1:8091"
