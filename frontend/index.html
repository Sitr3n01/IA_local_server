<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Production CSP.

      `connect-src 'none'` because the shipped console has no network access
      at all: it runs inside a WebView2 control hosted by cia-console.exe and
      talks to the operator's machine only through the native message bridge
      (window.chrome.webview.postMessage), never over HTTP. There is nothing
      for the page itself to fetch, so nothing is allowed to.

      vite.config.ts injects a development-only override of `connect-src`
      into this tag - but only when running under `vite dev`, never in
      `vite build` output - so the dev server can reach the loopback status
      endpoint while the production build keeps this tag exactly as written
      here. See vite.config.ts's `devCspOverride` plugin.

      No remote origins appear anywhere in this policy: no CDN, no remote
      fonts, no third-party scripts. Everything the console loads is bundled
      and served from 'self'.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'"
    />

    <title>IA Local Console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
