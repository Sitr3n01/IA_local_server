name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Windows validation
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Parse PowerShell and validate harness templates
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts/v2/*.ps1, integrations/*/*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            $errors += $parseErrors
          }
          if ($errors.Count -gt 0) {
            $errors | Format-List
            throw "PowerShell parse failures: $($errors.Count)"
          }
          ./scripts/v2/Test-V2HarnessConfig.ps1
          ./scripts/v2/Test-V2ConfigGeneration.ps1

      # Pure-Python, no server, no toolchain, sub-second. They guard the
      # qualification generation budget and the tool-argument contract -- the
      # two things the 2026-08-23 campaign got wrong -- so they belong in the
      # gate rather than in a runbook step someone remembers to run. The budget
      # test also pins the effective generation ceiling min(max_tokens,
      # n_predict), the deployment/constrained/expanded classification, and the
      # invariant that a retention probe never requests more than the context
      # window has left.
      - name: Qualification budget and tool-grading self-tests
        shell: pwsh
        run: |
          python ./scripts/v2/eval/test_qualify_budget.py
          python ./scripts/v2/eval/test_tool_grading.py

      # The chat-template contract needs a Jinja renderer, which is the only
      # third-party import in the gate. jinja2 is pure Python and pinned; the
      # test renders both the patched Ornith template and the verbatim upstream
      # copy it was derived from, so the developer-role fix is demonstrated on
      # every build rather than asserted once in a report. It also pins the
      # no-regression property the campaign evidence rests on: for every message
      # shape upstream already accepted, the patched template must produce a
      # byte-identical prompt.
      - name: Chat template developer-role contract
        shell: pwsh
        run: |
          python -m pip install --quiet --disable-pip-version-check jinja2==3.1.6
          python ./scripts/v2/eval/test_chat_template_contract.py

      - name: Production artifact store self-test
        shell: pwsh
        run: ./scripts/v2/Test-V2ArtifactStore.ps1

      - name: Release transaction and rollback self-test
        shell: pwsh
        run: ./scripts/v2/Test-V2ReleaseTransaction.ps1

      - name: Memory telemetry self-test
        shell: pwsh
        run: ./scripts/v2/Test-V2Telemetry.ps1

      - name: Agentic reuse harness self-test
        shell: pwsh
        run: ./scripts/v2/Test-V2AgenticHarness.ps1

      - name: Reject tracked binary/model artifacts
        shell: pwsh
        run: |
          $forbidden = @(git ls-files | Where-Object {
            $_ -match '(?i)\.(gguf|safetensors|pt|pth|exe|dll|zip|7z|tar|gz)$'
          })
          if ($forbidden.Count -gt 0) {
            $forbidden | Write-Error
            throw 'Tracked binary/model artifacts are forbidden.'
          }

  go:
    name: Go quality and tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        shell: pwsh
        run: |
          $unformatted = @(gofmt -l .)
          if ($unformatted.Count -gt 0) {
            $unformatted | Write-Error
            throw 'Run gofmt on the listed files.'
          }

      - name: Validate versioned model manifest
        shell: pwsh
        run: |
          go build -trimpath -o "$env:RUNNER_TEMP\cia-manifest.exe" ./cmd/cia-manifest
          ./scripts/v2/Test-V2Manifest.ps1 -SchemaValidatorPath "$env:RUNNER_TEMP\cia-manifest.exe"

      - name: Unit and contract tests
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        shell: pwsh
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          staticcheck ./...

      - name: Vulnerability analysis
        shell: pwsh
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Generate CycloneDX SBOM
        shell: pwsh
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
          cyclonedx-gomod mod -json -output sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cia-local-ai-sbom
          path: sbom.cdx.json
          if-no-files-found: error

  race:
    name: Race detector (portable core)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Race-enabled unit and contract tests
        run: go test -race ./...

  fork-gate:
    name: Fork provenance gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      # The gate's primary evidence is a compiled probe over the fork's own
      # checkpoint predicate, so it needs a C++ driver. Running it here, on a
      # runner that has one, keeps the executable half of the gate exercised
      # rather than skipped on the Windows job.
      - name: Gate unit tests with a C++ driver present
        shell: bash
        run: |
          g++ --version
          go test ./internal/forkgate/... -v -run TestProbe

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      # Gitleaks exits non-zero on a finding and prints nothing a reader can act
      # on: the console output is a count, and `--redact` blanks the one field
      # that would say where. The 2026-08-25 failure reported twelve leaks with
      # no rule, no file and no line, which is a gate that fails without
      # accusing anything.
      #
      # So take the report as JSON and print only metadata. .Secret and .Match
      # never leave the report file -- the whole point is to say WHERE to look,
      # not to reprint the finding into a public build log. The report is written
      # under RUNNER_TEMP rather than the workspace so no later step can pick it
      # up as an artifact.
      #
      # The exit code is captured before printing and re-raised afterwards, so
      # the summary is additive: a scan that finds something still fails.
      - name: Run Gitleaks
        shell: bash
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1

          set +e
          "$(go env GOPATH)/bin/gitleaks" git --no-banner --redact --report-format json --report-path "$RUNNER_TEMP/gitleaks.json"
          status=$?
          set -e

          # A clean scan still writes the file, holding an empty array, so gate on
          # the finding count rather than on the file existing.
          if [ -s "$RUNNER_TEMP/gitleaks.json" ] && [ "$(jq 'length' "$RUNNER_TEMP/gitleaks.json")" -gt 0 ]; then
            echo '::group::Gitleaks findings (rule / file / line / commit)'
            jq -r '.[] | [.RuleID, .File, (.StartLine|tostring), .Commit] | @tsv' "$RUNNER_TEMP/gitleaks.json" | sort -u
            echo '::endgroup::'
            echo
            echo 'Counts by rule:'
            jq -r '.[].RuleID' "$RUNNER_TEMP/gitleaks.json" | sort | uniq -c | sort -rn
          fi

          exit "$status"

  frontend:
    name: Frontend console
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        shell: bash
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        shell: bash
        working-directory: frontend
        run: npm run typecheck

      - name: Lint (ESLint + Stylelint)
        shell: bash
        working-directory: frontend
        run: npm run lint

      - name: Unit and component tests
        shell: bash
        working-directory: frontend
        run: npm test

      - name: Build production bundle
        shell: bash
        working-directory: frontend
        run: npm run build

      # Sprint 1's architecture rule: production has no network access at
      # all, and reaches the operator's machine only through the native
      # WebView2 bridge. This asserts the dev-only HTTP transport (and its
      # 127.0.0.1 base URL) did not leak into the bundle vite build just
      # produced, and that neither index.html nor any built CSS references
      # an external origin. See frontend/scripts/verify-prod-bundle.mjs.
      - name: Assert production bundle has no dev transport and no external origin
        shell: bash
        working-directory: frontend
        run: npm run verify:prod-bundle

      - name: Generate npm CycloneDX SBOM
        shell: bash
        working-directory: frontend
        run: npm sbom --sbom-format cyclonedx --package-lock-only > sbom.cdx.json

      - name: Upload frontend SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cia-console-frontend-sbom
          path: frontend/sbom.cdx.json
          if-no-files-found: error

      - name: Vulnerability scan (npm audit)
        shell: bash
        working-directory: frontend
        run: npm audit --audit-level=high

  frontend-quality:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Its own job, not extra steps on `frontend`. The two answer different
    # questions: `frontend` asks "does this build and pass its tests", this
    # asks "is this change worse than what is already on main". A red gate
    # should read as a quality regression at a glance, not be buried in a
    # build log. Scoped entirely to frontend/ - the Go control plane is graded
    # by the `go`, `race` and `validate` jobs and shares nothing with this one.
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        shell: bash
        working-directory: frontend
        run: npm ci

      - name: Collect deterministic metrics
        shell: bash
        working-directory: frontend
        run: npm run quality:collect

      - name: Render report
        shell: bash
        working-directory: frontend
        run: npm run quality:report

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cia-console-frontend-quality
          path: |
            frontend/reports/quality-gate.json
            frontend/reports/quality-gate.md

      # Blocking, and deliberately last. No continue-on-error: a quality
      # regression that does not fail the build is a report nobody reads.
      #
      # This job never writes quality/baseline.json. Re-recording the baseline
      # is a human act on main, in its own commit - if CI could do it, the
      # ratchet would reset itself every time it caught something.
      - name: Quality gate
        shell: bash
        working-directory: frontend
        run: npm run quality:check
