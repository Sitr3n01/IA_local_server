name: Feature request
description: Propose a change in behavior or a new capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Trust boundary
      description: Does this touch a listener, a credential, the administrative surface, what is logged, or how artifacts are promoted? If so, how should the invariants in the README still hold?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
